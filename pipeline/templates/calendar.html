<!DOCTYPE html>
<html>
<head><title>Connect Google Calendar</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; }
  a.btn { display: inline-block; padding: 12px 24px; font-size: 16px; background: #0a66c2; color: white; text-decoration: none; border-radius: 4px; }
  .error { color: red; }
</style>
</head>
<body>
  <h1>Step 3: Connect Google Calendar</h1>
  <p>Click the button below to authorize access to your Google Calendar.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <a class="btn" href="{{ auth_url }}">Connect Google Calendar</a>
</body>
</html>
