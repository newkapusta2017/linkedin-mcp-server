<!DOCTYPE html>
<html>
<head><title>LinkedIn Login - {{ user_id }}</title>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 20px auto; padding: 0 20px; }
  iframe { width: 100%; height: 600px; border: 1px solid #ccc; }
  button { padding: 12px 24px; font-size: 16px; background: #0a66c2; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 12px; }
  .error { color: red; }
  .info { color: #666; }
</style>
</head>
<body>
  <h1>Step 2: Log in to LinkedIn</h1>
  <p class="info">Log in to LinkedIn in the browser below. Complete any CAPTCHAs or email verification, then click "I'm logged in".</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if vnc_url %}
    <iframe src="{{ vnc_url }}"></iframe>
    <form method="post" action="/login/{{ user_id }}/done">
      <button type="submit">I'm logged in</button>
    </form>
  {% else %}
    <p>Starting browser session...</p>
    <meta http-equiv="refresh" content="3">
  {% endif %}
</body>
</html>
